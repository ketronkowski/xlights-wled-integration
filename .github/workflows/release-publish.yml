name: Publish Release Artifacts

on:
  release:
    types: [published]

env:
  IMAGE: ghcr.io/ketronkowski/xlights-wled-integration

jobs:
  retag-image:
    name: Retag published image with release version
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tags
        id: vars
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          MAJOR="${VERSION%%.*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.release.target_commitish }}" >> "$GITHUB_OUTPUT"

      - name: Wait for CI to publish the :sha image
        run: |
          SHA="${{ steps.vars.outputs.sha }}"
          for i in $(seq 1 20); do
            if docker buildx imagetools inspect "${IMAGE}:${SHA}" >/dev/null 2>&1; then
              echo "Found ${IMAGE}:${SHA}"
              exit 0
            fi
            echo "Waiting for ${IMAGE}:${SHA} to be published by ci.yml (attempt $i/20)..."
            sleep 15
          done
          echo "::error::${IMAGE}:${SHA} never appeared in GHCR"
          exit 1

      - name: Retag existing multi-arch manifest (no rebuild)
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.vars.outputs.version }} \
            -t ${{ env.IMAGE }}:${{ steps.vars.outputs.major }} \
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}

  attach-jar:
    name: Build and attach bootJar release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon -x test

      - name: Generate checksum
        run: |
          cd build/libs
          sha256sum xlights-wled-integration.jar > xlights-wled-integration.jar.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            build/libs/xlights-wled-integration.jar \
            build/libs/xlights-wled-integration.jar.sha256 \
            --clobber
