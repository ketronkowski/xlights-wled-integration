spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true

xlights:
  data-dir: ${XLIGHTS_DATA_DIR:/data}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.ketronkowski.xlights.validation: INFO
    com.ketronkowski.xlights.wled: INFO
    com.ketronkowski.xlights.web: INFO
