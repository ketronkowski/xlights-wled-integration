<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0d12" />
  <title>xLights ⇄ WLED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>xLights <span class="glyph">⇄</span> WLED</h1>
      <p class="tagline">Controller sync &amp; backup console</p>
    </div>

    <div class="bar-row">
      <input type="file" id="folderInputFallback" webkitdirectory directory multiple hidden />
      <button id="chooseFolderBtn" class="upload-picker" type="button">Choose xLights show folder…</button>
      <span id="folderLabel" class="status-line"></span>
      <button id="uploadBtn" disabled>Upload</button>
      <span id="uploadStatus" class="status-line"></span>
    </div>

    <div class="bar-row">
      <button id="refreshBtn">Refresh Status</button>
      <span class="sep"></span>
      <button id="cardViewBtn" class="view-toggle" type="button">Card View</button>
      <button id="listViewBtn" class="view-toggle" type="button">List View</button>
      <span class="sep"></span>
      <button id="selectAllBtn">Select All</button>
      <button id="selectNoneBtn">Select None</button>
      <span class="sep"></span>
      <button id="backupSelectedBtn" class="action" disabled>Backup Selected</button>
      <button id="restoreSelectedBtn" class="action danger" disabled>Restore Selected</button>
      <button id="updateSelectedBtn" class="action" disabled>Update Selected</button>
    </div>

    <div id="summaryLine" class="summary-line"></div>
  </header>

  <main class="views">
    <div id="cardGrid" class="card-grid">
      <p class="empty-hint">Upload an xLights show folder to see your WLED devices here.</p>
    </div>
    <div id="listGrid" class="list-view" hidden>
      <p class="empty-hint">Upload an xLights show folder to see your WLED devices here.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
